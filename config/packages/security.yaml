security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: auto
    role_hierarchy:
        ROLE_MANAGER: ROLE_CUSTOMER
        ROLE_ADMIN: ROLE_MANAGER
    providers:
        app_users:
            entity:
                class: App\Identity\Infrastructure\Security\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        login:
            pattern: ^/api/v1/auth/login$
            stateless: true
            provider: app_users
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
            json_login:
                check_path: api_login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
        api:
            pattern: ^/api
            stateless: true
            provider: app_users
            jwt: ~
        storefront:
            lazy: true
            provider: app_users
            custom_authenticators:
                - App\Storefront\Infrastructure\LoginAuthenticator
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
    access_control:
        - { path: ^/api/v1/auth/, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/admin/, roles: ROLE_MANAGER }
        - { path: ^/api/v1/me$, roles: ROLE_CUSTOMER }
        - { path: ^/account, roles: ROLE_CUSTOMER }
        - { path: ^/admin, roles: ROLE_MANAGER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
